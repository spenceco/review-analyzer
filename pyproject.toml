[project]
name = "review-analyzer"
version = "1.0.0"
description = "Upload a CSV of customer reviews and get an AI analysis with charts and an Excel report."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
